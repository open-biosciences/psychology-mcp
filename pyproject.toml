[project]
name = "psychology-mcp"
version = "0.1.0"
description = "FastMCP wrappers for scholarly literature APIs — enabling AI agents to ground psychology, behavioural and social-science claims in classified, provenance-bearing sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14.1,<3.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "ruff>=0.8",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psychology_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests (no network required)",
    "integration: marks tests as integration tests (require network)",
    "e2e: marks tests as end-to-end tests (require live server)",
    "crossref: tests for the Crossref DOI registry",
    "openalex: tests for the OpenAlex scholarly index",
    "europepmc: tests for Europe PMC",
    "semanticscholar: tests for the Semantic Scholar Academic Graph",
]
